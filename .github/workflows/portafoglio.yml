name: scarica-portafoglio
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portafoglio.yml"
      - ".github/workflows/scripts/portafoglio.py"
permissions:
  contents: write
jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python .github/workflows/scripts/portafoglio.py
      - run: python .github/workflows/scripts/storico.py
      - name: Salva
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "aggiorna dati portafoglio" || exit 0
          git pull --rebase
          git push
